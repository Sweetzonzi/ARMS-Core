plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-${mod_loader}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---- 仓库与依赖（独立文件，方便维护） ----
apply from: 'repositories.gradle'

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Provide the Minecraft/NeoForge runtime and tested mod classes to JUnit.
    unitTest {
        enable()
        testedMod.set(mods.getByName(project.mod_id))
    }
}

// 重新生成 GameTest 场地模板。产物是 src/main/resources 下的 .nbt，只在场地几何变化时才需要跑；
// 日常 gradlew test 只校验已有模板能否被解析，不重写它。
//
// 形态必须克隆已有的 test 任务：NeoForge 的 JUnit 启动器（net.neoforged.fml.junit.LaunchWrapper）
// 从系统属性 fml.junit.argsfile 指定的文件读启动参数（缺省找 mainargs.txt），另起一个裸 Test 任务会以
// NoSuchFileException: mainargs.txt 失败。这里直接指到 moddev 为 unitTest 生成的参数文件。
tasks.register("generateGameTestStructure", Test) {
    group = 'verification'
    description = 'Regenerate the GameTest structure template (data/arms_core/structure/empty_platform.nbt)'
    def base = tasks.named('test', Test).get()
    testClassesDirs = base.testClassesDirs
    classpath = base.classpath
    jvmArgs = base.jvmArgs
    // moddev 把 -Dfml.modFolders 挂在一个 JVM 参数提供者上，克隆 jvmArgs 带不过来；
    // 少了它，NeoForge 的启动器找不到本模组的类，代理到 LaunchServiceHandler 后抛 InvocationTargetException
    jvmArgumentProviders.addAll(base.jvmArgumentProviders)
    // 工作目录必须与 test 任务一致：FML 会把配置、脚本、崩溃报告落在工作目录下，
    // 用默认的项目根就会在仓库里留下 config/、kubejs/、crash-reports/、local/
    workingDir = base.workingDir
    useJUnitPlatform()
    systemProperty 'fml.junit.argsfile',
            layout.buildDirectory.file('moddev/junit/programArgs.txt').get().asFile.absolutePath
    systemProperty 'arms_core.regenerateGameTestStructure', 'true'
    filter {
        includeTestsMatching 'io.github.sweetzonzi.arms_core.tools.GenerateGameTestStructure'
    }
    outputs.upToDateWhen { false }
}

// ==========================================
// 开发期 mod 目录：双端的进四个 run，仅客户端的只进 runClient
// ==========================================
//
// 两份目录都在 `../Machine-Max` 下，各按「哪些 run 需要它」投放：
//
//   mods/         双端都要的（Curios、SuperbWarfare）→ runClient / runServer / runGameTestServer /
//                 runData 都加载
//   client_mods/  只在客户端成立的（DistantHorizons、Iris、Sodium）→ 只有 runClient 加载
//
// GeckoLib 与 Spark 的 jar 不在这两份目录里：它们与其它来源的同名模块同时进入模块层时，
// ModLauncher 会在模块解析阶段抛 java.lang.module.ResolutionException 并中止启动。两份 jar 现位于
// `../Machine-Max/mods-disabled/`，那份目录不参与任何 run；GeckoLib 本身已由 Spark-Core 与
// Machine-Max 的 Maven 依赖提供。
//
// client_mods 不能进服务端 run：DistantHorizons 在 ServerAboutToStart 里把服务器强转
// DedicatedServer，而 GameTestServer 不是该类型，进程会在启动阶段以 ClassCastException 退出。
//
// 两份都不写在 runtimeOnly 上。那是所有 run 共用的基类路径，且文件依赖没有坐标，会作为 root
// component 进入 runtimeElements，随复合构建传给下游项目。挂载点是 moddev 为每个 run 各建的
// `<run>AdditionalRuntimeClasspath`，它只被对应的那个 run 消费；核对办法是 build/moddev/ 下
// 的四份 *LegacyClasspath.txt。目录不存在时静默为空。
def sharedModsDir = project.file('../Machine-Max/mods')
def clientOnlyModsDir = project.file('../Machine-Max/client_mods')

configurations {
    devSharedMods
}

if (sharedModsDir.isDirectory()) {
    dependencies {
        devSharedMods files(fileTree(dir: sharedModsDir, includes: ['*.jar']))
    }
} else {
    logger.lifecycle("未找到双端 mod 目录 {}，四个 run 都不加载 Curios / SuperbWarfare",
            sharedModsDir)
}

[
        'client'        : configurations.clientAdditionalRuntimeClasspath,
        'server'        : configurations.serverAdditionalRuntimeClasspath,
        'data'          : configurations.dataAdditionalRuntimeClasspath,
        'gameTestServer': configurations.gameTestServerAdditionalRuntimeClasspath,
].each { runName, config ->
    config.extendsFrom(configurations.devSharedMods)
}

if (clientOnlyModsDir.isDirectory()) {
    dependencies {
        clientAdditionalRuntimeClasspath files(fileTree(dir: clientOnlyModsDir, includes: ['*.jar']))
    }
} else {
    logger.lifecycle("未找到仅客户端 mod 目录 {}，runClient 将不加载 DistantHorizons / Iris / Sodium",
            clientOnlyModsDir)
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    filteringCharset = 'UTF-8'
    var replaceProperties = [minecraft_version           : minecraft_version,
                             minecraft_version_range    : minecraft_version_range,
                             neo_version                : neo_version,
                             neo_version_range          : neo_version_range,
                             loader_version_range       : loader_version_range,
                             mod_id                     : mod_id,
                             mod_name                   : mod_name,
                             mod_license                : mod_license,
                             mod_version                : mod_version,
                             mod_authors                : mod_authors,
                             mod_description            : mod_description,
                             spark_core_version         : spark_core_version,
                             ballistics_framework_version: ballistics_framework_version,
                             machine_max_version        : machine_max_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
